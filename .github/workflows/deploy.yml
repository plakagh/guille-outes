name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/your-project

            echo "→ Pulling latest changes..."
            git pull origin main

            echo "→ Pulling updated Docker images..."
            cd docker
            docker compose pull

            echo "→ Starting services..."
            docker compose up -d

            echo "→ Waiting for database..."
            until docker exec supabase-db pg_isready -U postgres -q; do sleep 2; done

            echo "→ Applying migrations..."
            cd /opt/your-project
            PGSSLMODE=disable supabase db push \
              --db-url "postgresql://postgres:${{ secrets.PROD_DB_PASSWORD }}@127.0.0.1:5433/postgres"

            # The migrations carry the catalogue rows, but not the photographs:
            # SQL moves text. The image files arrived with the `git pull` above,
            # because `infra/media/` is committed, so all that is left is to move
            # them into the storage bucket and record the rows.
            #
            # Run inside a throwaway container because the VPS has no Node, and
            # the importer needs none of npm — only built-ins and `fetch`. It
            # talks to Kong over the loopback address rather than the public URL,
            # so the upload never leaves the machine.
            #
            # Idempotent: object paths are hashes of the file contents, so a
            # deploy that changes no image uploads nothing new.
            echo "→ Importing product images..."
            set -a
            . /opt/your-project/docker/.env
            set +a
            docker run --rm --network host \
              -v /opt/your-project:/infra -w /infra \
              -e SUPABASE_URL="http://127.0.0.1:${KONG_HTTP_PORT}" \
              -e SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}" \
              node:22-alpine node scripts/import-media.mjs

            echo "→ Pruning old images..."
            docker image prune -f

            echo "✓ Deploy complete"

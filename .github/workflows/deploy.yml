name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/your-project

            echo "→ Pulling latest changes..."
            git pull origin main

            echo "→ Pulling updated Docker images..."
            cd docker
            docker compose pull

            echo "→ Starting services..."
            docker compose up -d

            echo "→ Waiting for database..."
            until docker exec supabase-db pg_isready -U postgres -q; do sleep 2; done

            echo "→ Applying migrations..."
            cd /opt/your-project
            PGSSLMODE=disable supabase db push \
              --db-url "postgresql://postgres:${{ secrets.PROD_DB_PASSWORD }}@127.0.0.1:5433/postgres"

            echo "→ Pruning old images..."
            docker image prune -f

            echo "✓ Deploy complete"

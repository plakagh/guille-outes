<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu enlace de acceso · Guille Outes</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
            <!-- Wordmark set in type, so it survives images being blocked -->
            <tr>
              <td style="background-color:#0a0a0a;padding:26px 32px;">
                <span style="font-family:'Arial Narrow',Arial,sans-serif;font-size:30px;font-weight:bold;letter-spacing:-0.5px;color:#ffffff;text-transform:uppercase;">
                  GUILLE <span style="font-weight:normal;">Outes</span>
                </span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#e2001a;height:4px;font-size:1px;line-height:1px;">&nbsp;</td>
            </tr>

            <tr>
              <td style="background-color:#ffffff;padding:40px 32px 32px;">
                <h1 style="font-family:Arial,sans-serif;font-size:22px;font-weight:bold;color:#0a0a0a;margin:0 0 14px;line-height:1.3;">
                  Entra sin contraseña
                </h1>
                <p style="font-family:Arial,sans-serif;font-size:15px;color:#444444;line-height:1.7;margin:0 0 24px;">
                  Aquí tienes tu enlace de acceso a la tienda. Es de un solo uso.
                </p>

                <table cellpadding="0" cellspacing="0" border="0" style="margin-top:8px;">
                  <tr>
                    <td style="background-color:#0a0a0a;">
                      <a
                        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next={{ .RedirectTo }}"
                        style="display:inline-block;padding:15px 34px;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;text-transform:uppercase;letter-spacing:0.5px;"
                        >Entrar</a
                      >
                    </td>
                  </tr>
                </table>

                <p style="font-family:Arial,sans-serif;font-size:13px;color:#8f8f8f;line-height:1.6;margin:26px 0 0;">
                  El enlace caduca en 24 horas. Si no has pedido esto, puedes ignorar este mensaje.
                </p>
              </td>
            </tr>

            <tr>
              <td style="background-color:#1c1c1c;padding:18px 32px;">
                <p style="font-family:Arial,sans-serif;font-size:11px;color:#8f8f8f;margin:0;text-align:center;line-height:1.7;">
                  Este correo se ha enviado automáticamente. No respondas a este mensaje.<br />
                  &copy; Guille Outes
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
